# version: "3.9"

networks:
  public:
    name: public
    driver: bridge
    external: true

services:
## Network Proxy
  traefik:
    image: traefik:latest
    restart: always
    networks:
      public:
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    environment:
      TZ:
      CF_DNS_API_TOKEN:
      CF_ZONE_API_TOKEN:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # Use Docker Socket Proxy instead for improved security
      - ${DATA_DIR}/traefik/traefik.log:/traefik.log
      - ${DATA_DIR}/traefik/access.log:/access.log
      - ${DATA_DIR}/traefik/acme/cf-acme.json:/cf-acme.json
    command: # CLI arguments
      - "--providers.docker"
      - '--providers.docker.defaultrule=Host(`{{ index .Labels "com.docker.compose.service" }}.${DOMAINNAME}`)'
      - "--providers.docker.exposedByDefault=true"
      - "--providers.docker.network=public"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=https"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.https.address=:443"
      - "--entrypoints.https.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22"
      - "--entrypoints.https.http.tls.certResolver=cf"
      - "--entrypoints.https.http.tls.domains[0].main=${DOMAINNAME}"
      - "--entrypoints.https.http.tls.domains[0].sans=*.${DOMAINNAME}"
      # - "--entrypoints.https.http.middlewares=test-auth@docker"
      # - "--entrypoints.wtac-https.address=:443"
      # - "--entrypoints.wtac-https.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22"
      # - "--entrypoints.wtac-https.http.tls.certResolver=cf"
      - "--entrypoints.https.http.tls.domains[1].main=wtac.app"
      - "--entrypoints.https.http.tls.domains[1].sans=*.wtac.app"
      - "--certificatesresolvers.cf.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.cf.acme.storage=/cf-acme.json"
      - "--certificatesresolvers.cf.acme.dnschallenge=true"
      - "--certificatesresolvers.cf.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cf.acme.dnschallenge.provider=cloudflare"
      # Enable the Traefik log, for configurations and errors
      - "--log=true"
      - "--log.level=INFO" # (Default: error) DEBUG, INFO, WARN, ERROR, FATAL, PANIC
      - "--log.filePath=/traefik.log"
      - "--log.format=json" # (Default: common) COMMON, JSON
      # Enable the access log, with HTTP requests
      - "--accesslog=true"
      - "--accessLog.filePath=/access.log"
      - "--accessLog.format=json" # (Default: common) COMMON, JSON
      # Enable the Dashboard and API
      - "--api=true"
      - "--api.dashboard=true"
    labels:
      traefik.http.routers.traefik.middlewares: test-auth@docker
      traefik.http.routers.traefik.service: api@internal
      traefik.http.middlewares.test-auth.basicauth.users: '${TRAEFIK_BASICAUTH_USERS}'
      traefik.entrypoints.https.http.middleswares: 'test-auth@docker'
  ############################# DOWNLOADERS

  qbit:
    # image: "linuxserver/qbittorrent"
    image: "ghcr.io/hotio/qbittorrent"
    restart: always
    networks:
      public:
    ports:
      - "15310:15310/tcp"
      - "15310:15310/udp"
    volumes:
      - ${DATA_DIR}/qbit:/config
      - ${DOWNLOADS_DIR}:/downloads
    environment:
      TZ:
      PUID:
      PGID:
      UMASK_SET: 002
      UMASK: 002
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4"
    labels:
      traefik.http.routers.qbittorrent.middlewares: test-auth@docker
      traefik.http.services.qbittorent.loadbalancer.server.port: 8080

  ############################# INDEXERS

  # Jackett - Torrent proxy
  jackett:
    image: linuxserver/jackett
    restart: always
    networks:
      public:
    volumes:
      - ${DATA_DIR}/jackett:/config
      - ${DOWNLOADS_DIR}:/downloads
      - /etc/localtime:/etc/localtime:ro
    environment:
      PUID:
      PGID:
      TZ:
    labels:
      traefik.http.routers.jackett.middlewares: test-auth@docker
      traefik.http.services.jackett.loadbalancer.server.port: 9117

  ############################# PVRS

  # Radarr - Movie management
  radarr:
    image: linuxserver/radarr
    restart: always
    networks:
      public:
    volumes:
      # Optional. See why MediaCover is mounted as volume https://github.com/htpcBeginner/docker-traefik/discussions/147
      # - ${DOCKERDIR}/radarr/MediaCover:/config/MediaCover
      - ${DATA_DIR}/radarr:/config
      - ${MEDIA_DIR}:/media
      - /etc/localtime:/etc/localtime:ro
    environment:
      PUID:
      PGID:
      TZ:
    labels:
      traefik.http.routers.radarr.middlewares: test-auth@docker
      traefik.http.services.radarr.loadbalancer.server.port: 7878

  # Sonarr - TV Shows management
  sonarr:
    image: linuxserver/sonarr
    restart: always
    networks:
      public:
    volumes:
      # Optional. See why MediaCover is mounted as volume https://github.com/htpcBeginner/docker-traefik/discussions/147
      # - ${DOCKERDIR}/sonarr/MediaCover:/config/MediaCover
      - ${DATA_DIR}/sonarr:/config
      - ${MEDIA_DIR}:/media
      - /etc/localtime:/etc/localtime:ro
    environment:
      PUID:
      PGID:
      TZ:
    labels:
      traefik.http.routers.sonarr.middlewares: test-auth@docker
      traefik.http.services.sonarr.loadbalancer.server.port: 8989

  # overseerr - request management
  overseerr:
    image: linuxserver/overseerr
    restart: always
    networks:
      public:
    volumes:
      - ${DATA_DIR}/overseerr:/config
    environment:
      PUID:
      PGID:
      TZ:
    labels:
      traefik.http.routers.overseerr.middlewares: test-auth@docker
      traefik.http.services.overseerr.loadbalancer.server.port: 5055

  ############################# MEDIA

  plexms:
    image: plexinc/pms-docker
    restart: always
    ports:
      - "32400:32400/tcp"
      - "3005:3005/tcp"
      - "8324:8324/tcp"
      - "32469:32469/tcp"
      - "1900:1900/udp" # conflicts with xTeVe
      - "32410:32410/udp"
      - "32412:32412/udp"
      - "32413:32413/udp"
      - "32414:32414/udp"
      - "33400:33400"
    volumes:
      - ${MEDIA_DIR}/movies:/media/movies:ro
      - ${MEDIA_DIR}/tvshows:/media/tvshows:ro
      - ${MEDIA_DIR}/music:/media/music:ro
      - ${DATA_DIR}/plexms:/config:rw
      - /dev/shm:/data/transcode:rw # Offload transcoding to RAM if you have enough RAM
      - /dev/dri:/dev/dri # Allow quicksync for hardware acceleration
    environment:
      TZ:
      PLEX_UID: ${PUID}
      PLEX_GID: ${PGID}
      PLEX_CLAIM:
      ADVERTISE_IP: ${PLEX_IP}
      ALLOWED_NETWORKS: 192.168.0.0/16,172.16.0.0/12,10.0.0.0/8
    deploy:
      resources:
        reservations:
          memory: 6G
          cpus: "3"


  wtac:
    build:
      context: ./wtac/wtac-app
    #   # Not `verify` — that stage runs the smoke gate in the image and is worth running on demand, not on
    #   # every `up`: `docker build --target verify .`
    #   target: runtime
    # image: wtac-app:local
    # container_name: wtac-app

    # **The load-bearing line.** Without the `127.0.0.1:` prefix Docker publishes on every interface, and
    # this app has no authentication by decision (spec §8). The server warns on startup whenever this flag is
    # the only thing holding that, which in a container is always.
    # ports:
    #  - "127.0.0.1:8080:8080"
    networks:
      public:

    environment:
      # Already the image's defaults; stated because this is the file somebody edits to change them, and a
      # port in `ports:` with nothing setting `PORT` is how the two drift apart.
      HOST: "0.0.0.0"
      PORT: "8080"

      # A Natsoft-internal meeting key, not derivable from the date: WTAC 2026 ran on 2026-09-04 and was
      # served at `20260905.SMS`. Unset means no socket, every card renders off the captures in the image,
      # and the page says so in words. During an event:
      #
      #   NATSOFT_LIVE_PATH=/LiveMeeting/20260905.SMS docker compose up
      # NATSOFT_LIVE_PATH: "${NATSOFT_LIVE_PATH:-}"

    # Nothing to flush — every write to `overrides.json` is synchronous and atomic before its response
    # returns — so a short stop is honest rather than optimistic.
    stop_grace_period: 5s
    restart: unless-stopped

    # Repeated from the image so a reader of this file learns that `/health` decides it. Keep the two in
    # step, or `compose` and `docker run` disagree about the same container.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch(`http://127.0.0.1:$${process.env.PORT}/health`).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    labels:
      traefik.http.routers.wtac.rule: 'Host(`www.wtac.app`)'
      traefik.http.services.wtac.loadbalancer.server.port: 8080

  # ntfy - self-hosted push notifications. smartd (host) posts to 127.0.0.1:8090.
  ntfy:
    image: binwiederhier/ntfy
    command: serve
    restart: always
    networks:
      public:
    ports:
      - "127.0.0.1:8090:80"   # host-local publish endpoint for smartd (no auth)
    environment:
      TZ:
      NTFY_BASE_URL: "https://ntfy.home.ahawp.com"
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: "/var/lib/ntfy/cache.db"
      NTFY_ATTACHMENT_CACHE_DIR: "/var/lib/ntfy/attachments"
    volumes:
      - ${DATA_DIR}/ntfy:/var/lib/ntfy
    labels:
      traefik.http.routers.ntfy.middlewares: test-auth@docker
      traefik.http.services.ntfy.loadbalancer.server.port: 80
